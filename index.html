<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地震情報ログ</title>

<style>
body{
  font-family:"Hiragino Sans","Segoe UI",sans-serif;
  background:#0a0a0a;
  color:#e0e0e0;
  margin:0;
  padding:20px;
}

#container{
  max-width:900px;
  margin:auto;
}

.header-section{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:20px;
  gap:20px;
}

h1{
  font-size:28px;
  margin:0;
  font-weight:600;
  flex:1;
}

.tsunami-notice{
  background:#1a1a1a;
  border:1px solid #444;
  border-radius:8px;
  padding:12px 14px;
  font-size:11px;
  color:#999;
  text-align:right;
  line-height:1.5;
  max-width:250px;
}

.control-card{
  background:#111;
  border-radius:14px;
  padding:16px;
  margin-bottom:25px;
  border:1px solid #333;
  box-shadow:0 4px 20px rgba(255,255,255,0.05);
}

.button-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.button-group-label{
  font-size:12px;
  color:#888;
  font-weight:600;
  width:100%;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:8px;
  margin-top:12px;
}

.button-group-label:first-of-type{
  margin-top:0;
}

button{
  background:#222;
  color:#e0e0e0;
  padding:8px 14px;
  border-radius:6px;
  border:1px solid #444;
  cursor:pointer;
  font-weight:500;
  font-size:13px;
  transition:all 0.2s;
}

button:hover{
  background:#333;
  border-color:#555;
}

button.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

#status{
  font-size:12px;
  color:#666;
  margin-top:12px;
  padding:8px 0;
  border-top:1px solid #333;
}

.card{
  background:#111;
  border-radius:14px;
  padding:16px;
  margin-bottom:20px;
  border:1px solid #333;
  box-shadow:0 4px 20px rgba(255,255,255,0.05);
}

.card-title{
  font-size:14px;
  color:#999;
  margin-bottom:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

textarea{
  width:100%;
  min-height:200px;
  background:#0a0a0a;
  color:#e0e0e0;
  border:1px solid #333;
  padding:14px;
  border-radius:8px;
  resize:none;
  font-size:14px;
  line-height:1.8;
  font-family:Consolas,Menlo,monospace;
  box-sizing:border-box;
  transition:border-color 0.2s;
}

textarea:focus{
  outline:none;
  border-color:#555;
}

textarea:hover{
  border-color:#444;
}

.copy-button{
  background:#333;
  color:#e0e0e0;
  padding:6px 12px;
  border-radius:6px;
  border:1px solid #555;
  cursor:pointer;
  font-weight:500;
  font-size:12px;
  transition:all 0.2s;
}

.copy-button:hover{
  background:#444;
  border-color:#666;
}

.copy-feedback{
  display:inline-block;
  margin-left:8px;
  color:#888;
  font-size:11px;
  opacity:0;
  transition:opacity 0.3s;
}

.copy-feedback.show{
  opacity:1;
}
</style>
</head>

<body>

<div id="container">

  <div class="header-section">
    <h1>地震情報（過去5回分）</h1>
    <div class="tsunami-notice">
      ⓘ 津波情報は手動で<br>選択してください
    </div>
  </div>

  <div class="control-card">

    <div class="button-group-label">📡 更新制御</div>
    <div class="button-group">
      <button onclick="loadLogs()">今すぐ更新</button>
      <button onclick="enableAutoCopy()">自動コピー</button>
    </div>

    <div class="button-group-label">🌊 津波情報（手動選択）</div>
    <div class="button-group">
      <button onclick="setTsunami('none')" class="active" id="tsunami-none">なし</button>
      <button onclick="setTsunami('forecast')" id="tsunami-forecast">予報</button>
      <button onclick="setTsunami('advisory')" id="tsunami-advisory">注意報</button>
      <button onclick="setTsunami('warning')" id="tsunami-warning">警報</button>
      <button onclick="setTsunami('major')" id="tsunami-major">大津波警報</button>
    </div>

    <div id="status">更新待機中...</div>

  </div>

  <div id="logs"></div>

</div>

<script>

// =====================================================
// ★ localStorage による津波設定の保存・復元
// =====================================================

function initTsunamiMode(){
  const saved = localStorage.getItem("tsunamiMode");
  if(saved){
    tsunamiMode = saved;
  }
  updateTsunamiButtons();
}

function setTsunami(mode){
  tsunamiMode = mode;
  localStorage.setItem("tsunamiMode", mode);
  updateTsunamiButtons();
  loadLogs();
}

function updateTsunamiButtons(){
  ["none", "forecast", "advisory", "warning", "major"].forEach(m => {
    const btn = document.getElementById("tsunami-" + m);
    if(btn){
      btn.classList.toggle("active", tsunamiMode === m);
    }
  });
}

// =====================================================
// グローバル変数
// =====================================================

let AUTO_COPY = false;
let lastHash = "";
let tsunamiMode = "none";
let ws = null;
const WS_URL = "wss://api.p2pquake.net/v2/ws";

// =====================================================
// ★ WebSocket（最新データ受信時に再読み込み）
// =====================================================

function connectWebSocket(){
  try{
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      updateStatus();
    };

    ws.onmessage = (event) => {
      try{
        const data = JSON.parse(event.data);
        if(data && data.earthquake){
          loadLogs();
        }
      }catch(e){
        console.log("WS parse error", e);
      }
    };

    ws.onclose = () => {
      updateStatus();
      setTimeout(connectWebSocket, 3000);
    };

    ws.onerror = () => {
      console.log("WS error");
    };
  }catch(e){
    console.log("WS接続失敗", e);
  }
}

// =====================================================
// ユーティリティ
// =====================================================

function formatTimeOneLine(date){
  const d = new Date(date);
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+
         d.getHours()+"時"+String(d.getMinutes()).padStart(2,"0")+"分";
}

function updateStatus(){
  const wsStatus = ws && ws.readyState === WebSocket.OPEN ? "WS接続中" : "WS切断";
  document.getElementById("status").innerText = 
    "最終更新: " + formatTimeOneLine(new Date()) + " | " + wsStatus;
}

function normalizeCityName(raw){
  if (!raw) return "不明";
  raw = raw.replace(/[０-９Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248));
  raw = raw.replace(/\s+/g, "");
  raw = raw.replace(/（.*?）/g, "");
  raw = raw.replace(/[-ー－]+$/g, "");

  const specialCities = [
    "田村市","市川市","市原市","野々市市","四日市市","町田市","十日町市",
    "大町市","山村市","村山市","東村山市","武蔵村山市","羽村市","大村市",
    "余市町","市貝町","上市町","市川三郷町","市川町","下市町",
    "大町町","村田町","玉村町","中村区"
  ];
  if (specialCities.includes(raw)) return raw;

  const posCity = raw.indexOf("市");
  if (posCity > 0) return raw.substring(0, posCity + 1);

  const chars = ["区","町","村"];
  let cutPos = -1;
  for (const c of chars) {
    const pos = raw.indexOf(c);
    if (pos > 0 && (cutPos === -1 || pos < cutPos)) cutPos = pos;
  }

  if (cutPos > 0) return raw.substring(0, cutPos + 1);
  return raw;
}

function normalizePref(pref){
  if(!pref)return"不明";
  pref=pref.replace(/\s+/g,"");
  if(pref==="東京")return"東京都";
  if(pref==="大阪")return"大阪府";
  if(pref==="京都")return"京都府";
  if(!/都|道|府|県$/.test(pref))return pref+"県";
  return pref;
}

function buildIntensity(points){
  const cityMax = {};

  points.forEach(p => {
    const pref = normalizePref(p.pref || p.area || "不明");
    const city = normalizeCityName(p.city || p.addr || p.station || p.area || "不明");
    const scale = p.scale;
    const key = pref + ":" + city;

    if (!cityMax[key] || cityMax[key] < scale) {
      cityMax[key] = scale;
    }
  });

  const grouped = {};

  Object.entries(cityMax).forEach(([key, scale]) => {
    const [pref, city] = key.split(":");

    if (!grouped[scale]) grouped[scale] = {};
    if (!grouped[scale][pref]) grouped[scale][pref] = [];

    grouped[scale][pref].push(city);
  });

  const ORDER = [70,60,55,50,45,40,30,20,10];
  const scaleMap = {10:"1",20:"2",30:"3",40:"4",45:"5弱",50:"5強",55:"6弱",60:"6強",70:"7"};

  let out = "";

  ORDER.forEach(s => {
    if (!grouped[s]) return;

    out += "【震度" + scaleMap[s] + "】\n";
    out += "━━━━━━━━━━━\n";

    Object.keys(grouped[s]).sort().forEach(pref => {
      const cities = [...new Set(grouped[s][pref])];
      out += "■ " + pref + "\n";
      out += "  ・" + cities.join("　") + "\n\n";
    });
  });

  return out.trimEnd();
}

function getTsunamiDisplay(){
  if(tsunamiMode === "none"){
    return "この地震による津波の心配はありません。";
  }
  if(tsunamiMode === "forecast"){
    return "〈津波予報〉\n現在津波予報を発表中です";
  }
  if(tsunamiMode === "advisory"){
    return "〈津波注意報〉\n現在津波注意報を発表中です";
  }
  if(tsunamiMode === "warning"){
    return "〈⚠ 津波警報〉\n現在津波警報を発表中です";
  }
  if(tsunamiMode === "major"){
    return "〈⚠ 大津波警報〉\n現在大津波警報を発表中です";
  }

  return "この地震による津波の心配はありません。";
}

function enableAutoCopy(){
  AUTO_COPY = !AUTO_COPY;
  const btn = event.target;
  if(AUTO_COPY){
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }
}

// =====================================================
// ★ issue type による判定とテキスト生成
// =====================================================

function buildEarthquakeText(q, scaleMap){
  const eq = q.earthquake;
  const h = eq.hypocenter || {};
  const latest = q.issue || {};

  let depth = "不明";
  if(h.depth === 0) depth = "ごく浅い";
  else if(h.depth != null) depth = h.depth + "km";

  const depthDisplay = (depth === "ごく浅い") ? "ごく浅い" : "約" + depth;

  const maxRaw = q.points.reduce((m,p) => Math.max(m, p.scale || 0), 0);
  let magStr = (typeof h.magnitude === "number") ? h.magnitude.toFixed(1) : "---";

  const intensityRaw = buildIntensity(q.points);
  const formattedIntensity = intensityRaw
    .split('\n')
    .filter(line => line.trim() !== "" && !line.includes("━━━━━━━━━━━"))
    .map(line => {
      if (line.includes("【震度")) return "\n" + line.replace(/【震度(.*?)】/, "▽震度$1");
      if (line.includes("■ ")) return line.replace(/■ (.*)/, "【$1】");
      return line.replace(/[  ]*・/g, "");
    })
    .join('\n')
    .trim();

  const tsunamiMsg = getTsunamiDisplay();

  // ★ issue type の判定
  const issueType = latest.type;
  let text = "";

  if(issueType === "ScalePrompt"){
    // 震度速報
    text = `《震度速報　最大震度${scaleMap[maxRaw] || "---"}》
${formatTimeOneLine(eq.time)}頃、${h.name || "不明"}で地震がありました。
${tsunamiMsg}`;

  } else if(issueType === "Destination"){
    // 震源速報
    text = `《震源速報》
${formatTimeOneLine(eq.time)}頃、${h.name || "不明"}で地震がありました。
　M${magStr}
　震源の深さ:${depthDisplay}
${tsunamiMsg}`;

  } else {
    // デフォルト: 地震情報
    text = `《地震情報》
${formatTimeOneLine(eq.time)}頃、${h.name || "不明"}で地震がありました。
　最大震度: ${scaleMap[maxRaw] || "---"}
　M${magStr}
　震源の深さ:${depthDisplay}
${tsunamiMsg}

　●各地の震度情報●
${formattedIntensity}`;
  }

  return text;
}

// =====================================================
// メイン処理
// =====================================================

async function loadLogs(){
  updateStatus();

  try{
    const res = await fetch("https://api.p2pquake.net/v2/history?codes=551&limit=5");
    const data = await res.json();

    let html = "";
    let allText = "";
    let latestText = "";

    const scaleMap = {10:"1",20:"2",30:"3",40:"4",45:"5弱",50:"5強",55:"6弱",60:"6強",70:"7"};

    for(let i = 0; i < data.length; i++){
      const q = data[i];
      const text = buildEarthquakeText(q, scaleMap);

      if(i === 0) latestText = text;

      html += `
<div class="card">
  <div class="card-header">
    <div class="card-title">${i+1}件目の地震</div>
    <button class="copy-button" onclick="copyOne(this)">コピー</button>
    <span class="copy-feedback"></span>
  </div>
  <textarea readonly>${text}</textarea>
</div>`;

      allText += text + "\n";
    }

    window.ALL_LOGS = allText.trimEnd();
    document.getElementById("logs").innerHTML = html;

    if (AUTO_COPY && latestText !== lastHash) {
      lastHash = latestText;
      navigator.clipboard.writeText(latestText);
    }

  }catch(e){
    console.error("Error loading logs:", e);
    document.getElementById("logs").innerHTML = '<div class="card"><p style="color:#f00;">エラー: データの取得に失敗しました</p></div>';
  }
}

function copyOne(btn){
  const textarea = btn.closest(".card").querySelector("textarea");
  navigator.clipboard.writeText(textarea.value).then(() => {
    const feedback = btn.nextElementSibling;
    feedback.textContent = "✓ コピーしました";
    feedback.classList.add("show");
    setTimeout(() => {
      feedback.classList.remove("show");
    }, 2000);
  });
}

function copyAll(){
  navigator.clipboard.writeText(window.ALL_LOGS || "").then(() => {
    alert("全件をコピーしました");
  });
}

// =====================================================
// 起動
// =====================================================

initTsunamiMode();
loadLogs();
setInterval(loadLogs, 2000);
connectWebSocket();

</script>

</body>
</html>
